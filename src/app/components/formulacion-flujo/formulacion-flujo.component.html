<div class="rb-page">
  <nav
    class="rb-nav sticky top-0 z-50 flex flex-col items-stretch gap-3 bg-primary text-white shadow-sm dark:shadow-none sm:flex-row sm:items-center sm:justify-between"
  >
    <h1 class="rb-nav-title text-center text-white sm:text-left">Formulación de recetas</h1>
    <div class="flex flex-col gap-2 sm:flex-row sm:flex-wrap sm:items-center sm:justify-end">
      <app-comprador-nav variant="primary" />
      <app-logout-button variant="on-dark" />
    </div>
  </nav>

  <div class="rb-container mx-auto max-w-5xl py-8 sm:py-10">
    <header class="mb-8 flex flex-col gap-4 sm:flex-row sm:items-start sm:justify-between">
      <div class="text-center sm:text-left">
        <h2 class="rb-heading text-2xl sm:text-3xl">Formulación con IA</h2>
        <p class="rb-kicker mt-2 max-w-2xl">
          Completa los pasos en orden: objetivo nutricional, parametrización y generación de recetas.
        </p>
      </div>
      <button
        type="button"
        class="rb-btn rb-btn-secondary inline-flex min-h-11 shrink-0 items-center justify-center gap-2 self-center sm:self-start"
        [disabled]="cargandoValoresAnteriores()"
        (click)="cargarValoresAnteriores()"
      >
        <ng-icon name="heroArrowPath" size="18" />
        {{ cargandoValoresAnteriores() ? 'Cargando...' : 'Valores anteriores' }}
      </button>
    </header>

    <nav
      class="mb-8 flex flex-col gap-2 rounded-xl border border-gray-200 bg-white p-2 dark:border-dark-border dark:bg-dark-surface sm:flex-row sm:items-stretch"
      aria-label="Pasos de formulación"
    >
      <button
        *ngFor="let paso of pasos"
        type="button"
        class="flex flex-1 items-center gap-3 rounded-lg px-4 py-3 text-left transition"
        [class.bg-primary/10]="pasoActivo(paso.id)"
        [class.ring-2]="pasoActivo(paso.id)"
        [class.ring-primary]="pasoActivo(paso.id)"
        [class.dark:bg-orange-500/10]="pasoActivo(paso.id)"
        [class.dark:ring-orange-400]="pasoActivo(paso.id)"
        (click)="cambiarPestana(paso.id)"
      >
        <span
          class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full text-sm font-bold"
          [class.bg-primary]="pasoActivo(paso.id) || pasoCompletado(paso.id)"
          [class.text-white]="pasoActivo(paso.id) || pasoCompletado(paso.id)"
          [class.bg-gray-100]="!pasoActivo(paso.id) && !pasoCompletado(paso.id)"
          [class.text-gray-600]="!pasoActivo(paso.id) && !pasoCompletado(paso.id)"
          [class.dark:bg-slate-800]="!pasoActivo(paso.id) && !pasoCompletado(paso.id)"
        >
          {{ paso.numero }}
        </span>
        <span class="min-w-0">
          <span class="block text-xs font-medium uppercase tracking-wide text-neutral-muted">Paso {{ paso.numero }}</span>
          <span class="block text-sm font-semibold text-gray-900 dark:text-dark-text-strong">{{ paso.titulo }}</span>
        </span>
        <ng-icon
          [name]="paso.icono"
          size="20"
          class="ml-auto shrink-0"
          [class.text-primary]="pasoActivo(paso.id)"
          [class.dark:text-orange-400]="pasoActivo(paso.id)"
        />
      </button>
    </nav>

    <div [class.hidden]="pestanaActual() !== 'objetivo'">
      <app-objetivo-nutricional [modoEmbebido]="true" (objetivoGuardado)="onObjetivoGuardado()" />
      <div
        class="mt-6 flex flex-col gap-3 border-t border-gray-200 pt-6 dark:border-dark-border sm:flex-row sm:justify-end"
      >
        <button
          type="button"
          class="rb-btn rb-btn-primary inline-flex min-h-11 items-center justify-center gap-2 px-8"
          (click)="continuarAPaso2()"
        >
          Continuar al paso 2
          <ng-icon name="heroChevronRight" size="18" />
        </button>
      </div>
    </div>

    <div [class.hidden]="pestanaActual() !== 'parametrizacion'">
      <app-parametrizacion-formulacion
        [modoEmbebido]="true"
        (parametrizacionGuardada)="onParametrizacionGuardada()"
      />
      <div
        class="mt-6 flex flex-col gap-3 border-t border-gray-200 pt-6 dark:border-dark-border sm:flex-row sm:items-center sm:justify-between"
      >
        <button
          type="button"
          class="rb-btn rb-btn-secondary inline-flex min-h-11 items-center gap-2"
          (click)="cambiarPestana('objetivo')"
        >
          <ng-icon name="heroChevronLeft" size="18" />
          Paso 1
        </button>
        <button
          type="button"
          class="rb-btn rb-btn-primary inline-flex min-h-11 items-center justify-center gap-2 px-8"
          (click)="irAFormular()"
        >
          <ng-icon name="heroSparkles" size="18" />
          Formular
        </button>
      </div>
    </div>

    <div [class.hidden]="pestanaActual() !== 'formular'">
      <app-formular-receta [modoEmbebido]="true" />
    </div>
  </div>
</div>

<div *ngIf="modal() as m" class="rb-modal-backdrop z-[100]">
  <div class="rb-modal max-w-md text-center">
    <ng-icon
      [name]="m.tipo === 'ok' ? 'heroCheckCircle' : 'heroXCircle'"
      size="40"
      [class.text-green-600]="m.tipo === 'ok'"
      [class.text-red-600]="m.tipo === 'error'"
      class="mx-auto"
    />
    <h3 class="mt-3 text-lg font-semibold text-gray-900 dark:text-dark-text-strong">{{ m.titulo }}</h3>
    <p class="mt-2 text-sm text-neutral-muted dark:text-dark-text-muted">{{ m.mensaje }}</p>
    <button type="button" class="rb-btn rb-btn-primary mt-6 w-full sm:w-max" (click)="cerrarModal()">
      Entendido
    </button>
  </div>
</div>
