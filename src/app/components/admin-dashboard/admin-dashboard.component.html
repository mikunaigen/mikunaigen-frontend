<div class="rb-page">
  <div class="rb-container">
    <div class="rb-card overflow-hidden">
      <header
        class="sticky top-0 z-50 border-b border-white/10 bg-secondary px-4 py-6 text-white shadow-md dark:border-dark-border dark:bg-slate-800 dark:shadow-none sm:px-6 sm:py-7 lg:px-8"
      >
        <div class="mb-6 flex flex-col items-stretch justify-between gap-4 sm:flex-row sm:items-center">
          <div class="flex items-start gap-3">
            <div
              class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-white sm:h-12 sm:w-12"
            >
              <ng-icon name="heroChartPie" size="28" class="text-secondary" />
            </div>
            <div>
              <h1 class="text-2xl font-semibold tracking-tight sm:text-3xl lg:text-4xl">Dashboard y KPIs</h1>
              <p class="mt-1 text-sm text-white/80 lg:text-base">Indicadores DORA, ML y experiencia de usuario</p>
            </div>
          </div>
          <div class="flex w-full flex-col gap-2 sm:w-auto sm:flex-row sm:flex-wrap sm:items-center">
            <a
              routerLink="/gestion-administrador"
              class="inline-flex min-h-11 w-full items-center justify-center gap-2 rounded-xl border border-white/25 bg-white/10 px-4 py-3 text-sm font-semibold text-white transition hover:bg-white/20 sm:w-max"
            >
              <ng-icon name="heroArrowLeft" size="18" />
              Volver al panel
            </a>
            <app-logout-button variant="on-dark" />
          </div>
        </div>
      </header>

      <div class="space-y-6 p-4 sm:space-y-8 sm:p-6 lg:p-8">
        <section class="rb-section-muted space-y-4">
          <div class="flex flex-col gap-4 sm:flex-row sm:flex-wrap sm:items-end">
            <div class="min-w-[140px] flex-1">
              <label class="rb-label !normal-case">Desde</label>
              <input
                type="date"
                [(ngModel)]="fromDate"
                class="rb-input rb-focus-secondary"
                name="desde"
              />
            </div>
            <div class="min-w-[140px] flex-1">
              <label class="rb-label !normal-case">Hasta</label>
              <input
                type="date"
                [(ngModel)]="toDate"
                class="rb-input rb-focus-secondary"
                name="hasta"
              />
            </div>
            <button
              type="button"
              (click)="cargar()"
              [disabled]="cargando"
              class="rb-btn-primary inline-flex min-h-11 w-full items-center justify-center gap-2 sm:w-max"
            >
              <ng-icon name="heroMagnifyingGlass" size="18" />
              Aplicar rango
            </button>
          </div>
        </section>

        <div
          *ngIf="datos?.alertaPrecision"
          class="flex items-start gap-3 rounded-xl border border-warning/40 bg-amber-50 p-4 text-sm text-amber-900 dark:border-amber-500/30 dark:bg-amber-950/40 dark:text-amber-100"
          role="alert"
        >
          <ng-icon name="heroExclamationTriangle" size="22" class="shrink-0 text-warning" />
          <p>La precisión del modelo está por debajo del umbral recomendado (95%).</p>
        </div>

        <p *ngIf="errorMsg" class="text-sm text-danger">{{ errorMsg }}</p>
        <p *ngIf="cargando" class="rb-kicker">Cargando indicadores…</p>

        <div
          *ngIf="!cargando && !errorMsg && datos?.kpis?.length"
          class="grid grid-cols-1 gap-4 sm:grid-cols-2 sm:gap-6 lg:grid-cols-3"
        >
          <article
            *ngFor="let k of datos!.kpis; trackBy: trackKpi"
            class="rb-card rb-card-pad flex flex-col gap-3 dark:shadow-none"
          >
            <div class="flex items-start justify-between gap-2">
              <h2 class="text-base font-semibold text-gray-900 dark:text-dark-text-strong sm:text-lg">
                {{ k.nombre }}
              </h2>
              <ng-icon
                [name]="iconoTendencia(k.tendencia)"
                size="22"
                [ngClass]="claseTendencia(k.tendencia)"
              />
            </div>
            <p class="text-2xl font-bold text-primary sm:text-3xl">{{ k.valor }}</p>
            <p class="rb-kicker text-xs sm:text-sm">{{ k.formula }}</p>
          </article>
        </div>

        <div
          *ngIf="!cargando && !errorMsg && datos && (!datos.kpis || datos.kpis.length === 0)"
          class="rb-card rb-card-pad text-center"
        >
          <p class="rb-kicker">No hay indicadores para el rango seleccionado.</p>
        </div>
      </div>
    </div>
  </div>
</div>
