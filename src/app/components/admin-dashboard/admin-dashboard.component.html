<div class="rb-page">
  <div class="rb-container mx-auto max-w-6xl py-8 sm:py-12">
    <header class="mb-8 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
      <div>
        <a
          routerLink="/gestion-administrador"
          class="inline-flex items-center gap-1 text-sm text-secondary underline dark:text-blue-400"
        >
          <ng-icon name="heroArrowLeft" size="16" />
          Panel de Administración
        </a>
        <h1 class="rb-heading mt-2 text-2xl sm:text-3xl">Dashboard y KPIs</h1>
        <p class="rb-kicker mt-1">Indicadores de la Plataforma</p>
      </div>
      <app-logout-button />
    </header>

    <section class="rb-section-muted mb-6 space-y-4">
      <div class="flex flex-col gap-4 sm:flex-row sm:flex-wrap sm:items-end">
        <div class="min-w-[140px] flex-1">
          <label class="rb-label !normal-case">Desde</label>
          <input
            type="date"
            [(ngModel)]="fromDate"
            class="rb-input rb-focus-secondary"
            name="desde"
          />
        </div>
        <div class="min-w-[140px] flex-1">
          <label class="rb-label !normal-case">Hasta</label>
          <input
            type="date"
            [(ngModel)]="toDate"
            class="rb-input rb-focus-secondary"
            name="hasta"
          />
        </div>
        <button
          type="button"
          (click)="cargar()"
          [disabled]="cargando"
          class="rb-btn-primary inline-flex min-h-11 w-full items-center justify-center gap-2 sm:w-max"
        >
          <ng-icon name="heroMagnifyingGlass" size="18" />
          Aplicar rango
        </button>
      </div>
    </section>

    <div
      *ngIf="datos?.alertaPrecision"
      class="mb-6 flex items-start gap-3 rounded-xl border border-warning/40 bg-amber-50 p-4 text-sm text-amber-900 dark:border-amber-500/30 dark:bg-amber-950/40 dark:text-amber-100"
      role="alert"
    >
      <ng-icon name="heroExclamationTriangle" size="22" class="shrink-0 text-warning" />
      <p>La precisión del modelo está por debajo del umbral recomendado (95%).</p>
    </div>

    <p *ngIf="errorMsg" class="mb-4 text-sm text-danger">{{ errorMsg }}</p>
    <p *ngIf="cargando" class="rb-kicker mb-4">Cargando indicadores...</p>

    <div
      *ngIf="!cargando && !errorMsg && datos?.kpis?.length"
      class="grid grid-cols-1 gap-4 sm:grid-cols-2 sm:gap-6 lg:grid-cols-3"
    >
      <article
        *ngFor="let k of datos!.kpis; trackBy: trackKpi"
        class="rb-card rb-card-pad flex flex-col gap-3 dark:shadow-none"
      >
        <div class="flex items-start justify-between gap-2">
          <h2 class="text-base font-semibold text-gray-900 dark:text-dark-text-strong sm:text-lg">
            {{ k.nombre }}
          </h2>
          <ng-icon
            [name]="iconoTendencia(k.tendencia)"
            size="22"
            [ngClass]="claseTendencia(k.tendencia)"
          />
        </div>
        <p class="text-2xl font-bold text-primary sm:text-3xl">{{ k.valor }}</p>
        <p class="rb-kicker text-xs sm:text-sm">{{ k.formula }}</p>
      </article>
    </div>

    <div
      *ngIf="!cargando && !errorMsg && datos && (!datos.kpis || datos.kpis.length === 0)"
      class="rb-card rb-card-pad text-center"
    >
      <p class="rb-kicker">No hay indicadores para el rango seleccionado.</p>
    </div>
  </div>
</div>
