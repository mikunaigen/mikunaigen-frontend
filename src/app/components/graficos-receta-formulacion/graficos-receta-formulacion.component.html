<div class="grid grid-cols-1 gap-6 xl:grid-cols-3">
  <button
    type="button"
    class="group rounded-xl border border-gray-200 bg-white p-4 text-left transition hover:border-secondary/40 hover:shadow-md focus:outline-none focus-visible:ring-2 focus-visible:ring-secondary dark:border-dark-border dark:bg-slate-900/40 dark:hover:border-blue-500/40"
    (click)="onClickTarjeta($event, 'composicion')"
    (keydown)="onTeclaTarjeta($event, 'composicion')"
  >
    <div class="mb-3 flex items-center justify-between gap-2">
      <h4 class="flex items-center gap-2 text-sm font-semibold text-gray-900 dark:text-dark-text-strong">
        <ng-icon name="heroChartPie" size="18" />
        Composición de ingredientes
      </h4>
      <span
        class="inline-flex items-center gap-1 rounded-lg bg-secondary/10 px-2 py-1 text-xs font-medium text-secondary opacity-0 transition group-hover:opacity-100 dark:bg-sky-500/15 dark:text-sky-300"
      >
        <ng-icon name="heroArrowsPointingOut" size="14" />
        Ampliar
      </span>
    </div>
    <div class="relative h-56 sm:h-64 pointer-events-none">
      <canvas #canvasComposicion></canvas>
    </div>
  </button>

  <button
    type="button"
    class="group rounded-xl border border-gray-200 bg-white p-4 text-left transition hover:border-secondary/40 hover:shadow-md focus:outline-none focus-visible:ring-2 focus-visible:ring-secondary dark:border-dark-border dark:bg-slate-900/40 dark:hover:border-blue-500/40"
    (click)="onClickTarjeta($event, 'precision')"
    (keydown)="onTeclaTarjeta($event, 'precision')"
  >
    <div class="mb-3 flex items-center justify-between gap-2">
      <h4 class="flex items-center gap-2 text-sm font-semibold text-gray-900 dark:text-dark-text-strong">
        <ng-icon name="heroChartBar" size="18" />
        Precisión nutricional
      </h4>
      <span
        class="inline-flex items-center gap-1 rounded-lg bg-secondary/10 px-2 py-1 text-xs font-medium text-secondary opacity-0 transition group-hover:opacity-100 dark:bg-sky-500/15 dark:text-sky-300"
      >
        <ng-icon name="heroArrowsPointingOut" size="14" />
        Ampliar
      </span>
    </div>
    <div class="relative h-56 sm:h-64 pointer-events-none">
      <canvas #canvasPrecision></canvas>
    </div>
  </button>

  <button
    type="button"
    class="group rounded-xl border border-gray-200 bg-white p-4 text-left transition hover:border-secondary/40 hover:shadow-md focus:outline-none focus-visible:ring-2 focus-visible:ring-secondary dark:border-dark-border dark:bg-slate-900/40 dark:hover:border-blue-500/40"
    (click)="onClickTarjeta($event, 'semaforo')"
    (keydown)="onTeclaTarjeta($event, 'semaforo')"
  >
    <div class="mb-3 flex items-center justify-between gap-2">
      <h4 class="flex items-center gap-2 text-sm font-semibold text-gray-900 dark:text-dark-text-strong">
        <ng-icon name="heroSignal" size="18" />
        Semáforo normativo
      </h4>
      <span
        class="inline-flex items-center gap-1 rounded-lg bg-secondary/10 px-2 py-1 text-xs font-medium text-secondary opacity-0 transition group-hover:opacity-100 dark:bg-sky-500/15 dark:text-sky-300"
      >
        <ng-icon name="heroArrowsPointingOut" size="14" />
        Ampliar
      </span>
    </div>
    <div class="relative h-56 sm:h-64 pointer-events-none">
      <canvas #canvasSemaforo></canvas>
    </div>
  </button>
</div>

<app-detalle-grafico-receta-modal
  *ngIf="modalVisible"
  [alternativa]="alternativa"
  [tipo]="modalTipo"
  [visible]="true"
  (cerrar)="cerrarModal()"
/>
