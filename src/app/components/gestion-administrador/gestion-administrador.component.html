<div class="rb-page">
  <div class="rb-container">
    <header
      class="mb-6 flex flex-col gap-3 sm:mb-8 sm:flex-row sm:items-center sm:justify-between"
    >
      <div class="text-center sm:text-left">
        <h1 class="rb-heading">Panel de Administración</h1>
        <p class="rb-kicker mt-2">Bienvenido. ¿Qué deseas gestionar hoy?</p>
      </div>
      <div class="flex w-full flex-col gap-3 sm:w-auto sm:items-end">
        <app-comprador-nav variant="primary" />
        <app-logout-button />
      </div>
    </header>

    <section
      class="mb-8 rounded-xl border border-secondary/25 bg-secondary/5 p-4 dark:border-sky-500/25 dark:bg-sky-500/10 sm:p-5"
    >
      <div class="mb-4 flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between">
        <div>
          <div class="flex items-center gap-2 text-secondary dark:text-sky-300">
            <ng-icon name="heroSparkles" size="20" />
            <span class="text-xs font-semibold uppercase tracking-wide sm:text-sm">Formulación con IA</span>
          </div>
          <p class="mt-1 text-sm text-neutral-muted dark:text-dark-text-muted">
            Cuota y historial ilimitados · privilegios de Plan Nutricionista
          </p>
        </div>
        <a
          routerLink="/mis-recetas"
          class="rb-btn rb-btn-secondary inline-flex min-h-11 items-center justify-center gap-2 self-center sm:self-auto"
        >
          <ng-icon name="heroQueueList" size="18" />
          Historial de recetas
        </a>
      </div>

      <nav
        class="grid grid-cols-1 gap-2 sm:grid-cols-3"
        aria-label="Pasos de formulación para administrador"
      >
        <a
          routerLink="/formular"
          [queryParams]="{ tab: 'objetivo' }"
          class="flex items-center gap-3 rounded-xl border border-gray-200 bg-white px-4 py-3 transition hover:border-secondary/40 hover:shadow-md dark:border-dark-border dark:bg-slate-900/50 dark:hover:border-sky-500/40"
        >
          <span class="rb-feature-icon !mb-0 !h-10 !w-10 shrink-0">
            <ng-icon name="heroBeaker" size="22" />
          </span>
          <span class="min-w-0">
            <span class="block text-xs font-medium uppercase tracking-wide text-neutral-muted">Paso 1</span>
            <span class="block text-sm font-semibold text-gray-900 dark:text-dark-text-strong">Objetivo nutricional</span>
          </span>
          <ng-icon name="heroChevronRight" size="18" class="ml-auto shrink-0 text-neutral-muted" />
        </a>

        <a
          routerLink="/formular"
          [queryParams]="{ tab: 'parametrizacion' }"
          class="flex items-center gap-3 rounded-xl border border-gray-200 bg-white px-4 py-3 transition hover:border-secondary/40 hover:shadow-md dark:border-dark-border dark:bg-slate-900/50 dark:hover:border-sky-500/40"
        >
          <span class="rb-feature-icon !mb-0 !h-10 !w-10 shrink-0">
            <ng-icon name="heroAdjustmentsHorizontal" size="22" />
          </span>
          <span class="min-w-0">
            <span class="block text-xs font-medium uppercase tracking-wide text-neutral-muted">Paso 2</span>
            <span class="block text-sm font-semibold text-gray-900 dark:text-dark-text-strong">Parametrización</span>
          </span>
          <ng-icon name="heroChevronRight" size="18" class="ml-auto shrink-0 text-neutral-muted" />
        </a>

        <a
          routerLink="/formular"
          [queryParams]="{ tab: 'formular' }"
          class="flex items-center gap-3 rounded-xl border border-gray-200 bg-white px-4 py-3 transition hover:border-secondary/40 hover:shadow-md dark:border-dark-border dark:bg-slate-900/50 dark:hover:border-sky-500/40"
        >
          <span class="rb-feature-icon !mb-0 !h-10 !w-10 shrink-0">
            <ng-icon name="heroSparkles" size="22" />
          </span>
          <span class="min-w-0">
            <span class="block text-xs font-medium uppercase tracking-wide text-neutral-muted">Paso 3</span>
            <span class="block text-sm font-semibold text-gray-900 dark:text-dark-text-strong">Formular receta</span>
          </span>
          <ng-icon name="heroChevronRight" size="18" class="ml-auto shrink-0 text-neutral-muted" />
        </a>
      </nav>
    </section>

    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 sm:gap-5 lg:grid-cols-3 lg:gap-6">
