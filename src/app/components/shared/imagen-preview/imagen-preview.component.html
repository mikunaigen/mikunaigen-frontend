<div class="space-y-3">
  <label *ngIf="editable || etiqueta" class="rb-label !normal-case">{{ etiqueta }}</label>

  <input
    *ngIf="editable"
    [id]="inputId"
    type="file"
    class="sr-only"
    [accept]="accept"
    (change)="onArchivoSeleccionado($event)"
  />

  <div
    *ngIf="!vistaSrc() && editable"
    class="flex min-h-32 flex-col items-center justify-center gap-3 rounded-xl border-2 border-dashed border-gray-200 bg-gray-50 px-4 py-6 text-center dark:border-dark-border dark:bg-slate-900/50"
  >
    <span class="flex h-12 w-12 items-center justify-center rounded-full bg-white dark:bg-dark-surface">
      <ng-icon name="heroPhoto" size="28" class="text-secondary dark:text-blue-400" />
    </span>
    <p class="text-sm text-neutral-strong dark:text-dark-text-muted">{{ hint }}</p>
    <button type="button" class="rb-btn-secondary w-full sm:w-max" (click)="dispararSelector()">
      <span class="inline-flex items-center gap-2">
        <ng-icon name="heroArrowUpTray" size="18" />
        Seleccionar imagen
      </span>
    </button>
  </div>

  <div
    *ngIf="vistaSrc() as url"
    class="rounded-xl border border-gray-200 bg-gray-50 p-3 dark:border-dark-border dark:bg-slate-900/50"
  >
    <div class="mb-2 flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between">
      <p class="text-xs font-medium text-neutral-strong dark:text-dark-text-muted">Vista previa</p>
      <p *ngIf="nombreArchivo" class="truncate text-xs text-neutral-muted dark:text-dark-text-muted">
        {{ nombreArchivo }}
      </p>
    </div>

    <button
      type="button"
      class="group relative block w-full overflow-hidden rounded-lg border border-gray-200 bg-gray-100 dark:border-dark-border dark:bg-slate-800"
      (click)="abrirZoom()"
      aria-label="Ampliar imagen"
    >
      <img
        [src]="url"
        alt="Vista previa"
        class="mx-auto max-h-56 w-full object-contain transition group-hover:opacity-90 sm:max-h-64"
      />
      <span
        class="absolute bottom-2 right-2 inline-flex items-center gap-1 rounded-lg bg-black/60 px-2 py-1 text-xs font-semibold text-white"
      >
        <ng-icon name="heroArrowsPointingOut" size="14" />
        Ampliar
      </span>
    </button>

    <div class="mt-3 flex flex-col gap-2 sm:flex-row sm:flex-wrap">
      <button type="button" class="rb-btn-neutral w-full sm:w-max" (click)="abrirZoom()">
        <span class="inline-flex items-center gap-2">
          <ng-icon name="heroMagnifyingGlassPlus" size="18" class="text-secondary dark:text-blue-400" />
          Ver con zoom
        </span>
      </button>
      <button *ngIf="editable" type="button" class="rb-btn-neutral w-full sm:w-max" (click)="dispararSelector()">
        <span class="inline-flex items-center gap-2">
          <ng-icon name="heroArrowUpTray" size="18" class="text-secondary dark:text-blue-400" />
          Cambiar imagen
        </span>
      </button>
      <button *ngIf="editable" type="button" class="rb-btn-danger w-full sm:w-max" (click)="eliminar()">
        <span class="inline-flex items-center gap-2">
          <ng-icon name="heroTrash" size="18" />
          Eliminar
        </span>
      </button>
    </div>
  </div>

  <p *ngIf="errorLocal()" class="text-xs text-warning">{{ errorLocal() }}</p>
</div>

<div
  *ngIf="zoomAbierto()"
  class="rb-modal-backdrop z-[70]"
  role="dialog"
  aria-modal="true"
  (click)="cerrarZoom()"
>
  <div
    class="relative flex max-h-[92vh] w-full max-w-4xl flex-col overflow-hidden rounded-xl border border-gray-200 bg-white shadow-lg dark:border-dark-border dark:bg-dark-surface dark:shadow-none"
    (click)="$event.stopPropagation()"
  >
    <div
      class="flex flex-col gap-2 border-b border-gray-200 px-3 py-3 dark:border-dark-border sm:flex-row sm:items-center sm:justify-between sm:px-4"
    >
      <p class="text-sm font-semibold text-gray-900 dark:text-dark-text-strong">Vista ampliada</p>
      <div class="flex flex-wrap items-center gap-2">
        <button type="button" class="rb-btn-neutral min-h-11 px-3 py-2" (click)="alejar()" aria-label="Alejar">
          <ng-icon name="heroMinus" size="18" />
        </button>
        <span class="min-w-12 text-center text-xs font-semibold text-neutral-strong dark:text-dark-text-muted">
          {{ zoomNivel() * 100 | number: '1.0-0' }}%
        </span>
        <button type="button" class="rb-btn-neutral min-h-11 px-3 py-2" (click)="acercar()" aria-label="Acercar">
          <ng-icon name="heroPlus" size="18" />
        </button>
        <button type="button" class="rb-btn-neutral min-h-11 px-3 py-2 text-sm" (click)="restablecerZoom()">
          Ajustar
        </button>
        <button type="button" class="rb-btn-neutral min-h-11 px-3 py-2" (click)="cerrarZoom()" aria-label="Cerrar">
          <ng-icon name="heroXMark" size="20" />
        </button>
      </div>
    </div>

    <div class="flex flex-1 items-center justify-center overflow-auto bg-gray-100 p-4 dark:bg-slate-900">
      <img
        [src]="vistaSrc()"
        alt="Imagen ampliada"
        class="max-w-none origin-center object-contain transition-transform duration-150"
        [style.transform]="'scale(' + zoomNivel() + ')'"
      />
    </div>
  </div>
</div>
